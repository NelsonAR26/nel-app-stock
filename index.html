main{max-width:1180px;margin:0 auto;padding:0 12px}
.head h2{font:700 46px/1.05 var(--serif);letter-spacing:-.01em;color:var(--plum)}.head p{color:var(--mute);font-size:16.5px;margin:4px 0 16px}

.chips{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;flex:1;padding:8px 18px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}.chips::-webkit-scrollbar{display:none}

.chip{scroll-snap-align:start;flex:none;border:1px solid var(--line);background:rgba(255,255,255,.75);border-radius:99px;padding:8px 18px;font-weight:500;color:var(--plum)}
.chip.on{background:var(--plum);color:#fff;border-color:transparent}

option{background:#fff;color:#2A2230}
.tbw{padding:6px 12px 12px}
.tb{width:100%;border-collapse:collapse}

.tb td{padding:11px 10px;border-top:1px solid var(--line);font-size:15px}
.tb tbody tr:hover td{background:rgba(184,146,63,.07)}

.pill{display:inline-block;font-size:12.5px;border-radius:99px;padding:3px 12px;font-weight:600}

.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.more{display:block;margin:12px auto 2px}
.btn{border:0;background:linear-gradient(135deg,#E6C98C,#C9A24D);color:#2B1A2C;border-radius:12px;padding:10px 18px;font-weight:600;box-shadow:0 4px 14px rgba(184,146,63,.25)}

const COL=['#C9A24D','#C9708A','#7B4B7A','#6FA886','#D98E6B','#A78BB8','#B7A394','#8C6F3F'];
const SEC={rep:'Reposición',uso:'En uso'};
const I={plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/>',img:'<path d="M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9h.01"/>',del:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'};
const ico=(k)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2800)};
const fail=e=>{console.error(e);toast('No se pudo guardar. Revisá la conexión.')};
const types=()=>[...new Set([...(C.types||['Común','Semipermanente','Otros']),...P.map(p=>p.type)])];
const brands=()=>[...new Set([...(C.brands||BR),...P.map(p=>p.brand)])].sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));
const canonBrand=b=>brands().find(x=>norm(x)===norm(b))||String(b).trim();
const canonType=t=>{const n=norm(t);if(!n)return'Común';if(n.includes('semi'))return'Semipermanente';return types().find(x=>norm(x)===n)||String(t).trim().replace(/^./,c=>c.toUpperCase())};
const logoOf=b=>{const n=norm(b),o=C.logos&&C.logos[n];return o!==undefined?o:(BL[n]||'')};
const bmark=b=>{const l=logoOf(b);return l?`<span class="bl"><img src="${l}" alt="${esc(b)}" loading="lazy"></span>`:`<span class="mono" style="--c:${hue(b)}">${esc(b.slice(0,2).toUpperCase())}</span>`};
const st=p=>p.qty<1?['bad','Agotado']:p.qty<=2?['warn','Stock bajo']:['ok','Disponible'];

let C={},P=[],M=[],tab='res',brand='Todas',type='Todos',q='',days=30,lim=20,stat='Todos',ing='Todos',srt='new',unsub=[];

/* ---------- Sesión ---------- */
onAuthStateChanged(auth,u=>{
 $('#login').hidden=!!u;$('#app').hidden=!u;unsub.forEach(f=>f());unsub=[];if(!u)return;
 const er=()=>toast('Sin permiso o sin conexión con la base de datos');
 unsub.push(onSnapshot(collection(db,'polishes'),s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));render()},er));
 unsub.push(onSnapshot(collection(db,'movements'),s=>{M=s.docs.map(d=>d.data());if(tab==='inf'||tab==='res')render()},er));
 unsub.push(onSnapshot(doc(db,'settings','catalog'),s=>{C=s.exists()?s.data():{};render()},er));
});
$('#go').onclick=()=>signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value).catch(()=>$('#err').textContent='Correo o contraseña incorrectos.');
$('#out').onclick=()=>signOut(auth);
let ip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{ip.prompt();await ip.userChoice;$('#inst').hidden=true};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');

/* ---------- Operaciones ---------- */
const mv=(p,kind,n,now,x={})=>({pid:p.id||'',name:p.name,brand:p.brand,type:p.type,section:p.section,kind,qty:n,at:now,...x});
function addStock(d){
 const now=Date.now(),b=writeBatch(db),r=doc(collection(db,'polishes'));
 b.set(r,{...d,createdAt:now,lastIn:now,lastOut:null});
 b.set(doc(collection(db,'movements')),mv({...d,id:r.id},'in',d.qty,now));
 b.commit().catch(fail);toast('Esmalte cargado');
}
function withdraw(p,n,toUse){
 n=Math.min(n,p.qty);if(n<1)return;
 const now=Date.now(),b=writeBatch(db);
 b.update(doc(db,'polishes',p.id),{qty:increment(-n),lastOut:now});
 b.set(doc(collection(db,'movements')),mv(p,'out',n,now));
 if(toUse&&p.section==='rep'){
  const ex=P.find(x=>x.section==='uso'&&key(x)===key(p));
  if(ex)b.update(doc(db,'polishes',ex.id),{qty:increment(n),lastIn:now});
  else b.set(doc(collection(db,'polishes')),{name:p.name,brand:p.brand,type:p.type,section:'uso',qty:n,createdAt:now,lastIn:now,lastOut:null});
 }
 b.commit().catch(fail);toast(`Retiraste ${n}`);
}
const plusN=(p,n)=>{if(n<1)return;const now=Date.now(),b=writeBatch(db);b.update(doc(db,'polishes',p.id),{qty:increment(n),lastIn:now});b.set(doc(collection(db,'movements')),mv(p,'in',n,now));b.commit().catch(fail);toast(`Agregaste ${n}`)};
const remove=p=>{if(confirm(`¿Eliminar "${p.name}" de ${SEC[p.section]}?`)){const b=writeBatch(db);b.delete(doc(db,'polishes',p.id));b.commit().catch(fail)}};

/* ---------- Gráficos ---------- */
function donut(it){
 const t=it.reduce((a,x)=>a+x.v,0),T=t||1;let o=25;
 return `<svg viewBox="0 0 42 42" class="donut" role="img" aria-label="Unidades por marca"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="rgba(59,31,54,.08)" stroke-width="5"/>${it.map((x,i)=>{const d=x.v/T*100,s=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${COL[i%8]}" stroke-width="5" stroke-dasharray="${d} ${100-d}" stroke-dashoffset="${o}"/>`;o-=d;return s}).join('')}<text x="21" y="22.5" text-anchor="middle" class="dt">${t}</text><text x="21" y="27" text-anchor="middle" class="ds">unidades</text></svg>`;
}
const legend=it=>`<div class="lg">${it.map((x,i)=>`<span style="--c:${COL[i%8]}"><i></i>${esc(x.label)}<em>${x.v}</em></span>`).join('')}</div>`;
function cols(){
 const N=14,D=864e5,s0=new Date().setHours(0,0,0,0)-(N-1)*D,a=Array.from({length:N},()=>[0,0]);
 M.forEach(m=>{if(m.adj||m.at<s0)return;const i=Math.floor((m.at-s0)/D);if(i>=0&&i<N)a[i][m.kind==='in'?0:1]+=m.qty});
 const mx=Math.max(1,...a.flat()),w=560/N;
 return `<svg viewBox="0 0 560 160" class="cols" role="img" aria-label="Movimientos de los últimos 14 días">${[0,1,2].map(i=>`<line x1="0" x2="560" y1="${20+i*55}" y2="${20+i*55}" stroke="rgba(59,31,54,.09)"/>`).join('')}${a.map((v,i)=>{const x=i*w+4,h1=v[0]/mx*110,h2=v[1]/mx*110;return `<rect x="${x}" y="${130-h1}" width="${w/2-4}" height="${Math.max(h1,v[0]?2:0)}" rx="3" fill="#6FA886"/><rect x="${x+w/2-3}" y="${130-h2}" width="${w/2-4}" height="${Math.max(h2,v[1]?2:0)}" rx="3" fill="#C9A24D"/><text x="${x+w/4}" y="150" text-anchor="middle">${new Date(s0+i*D).getDate()}</text>`}).join('')}</svg><div class="key"><span><i style="background:#6FA886"></i>Ingresos</span><span><i style="background:#C9A24D"></i>Retiros</span></div>`;
}
const bar=(x,c)=>`<div class="bar ${c}"><span>${esc(x.name)} ${x.brand?`<small>${esc(x.brand)}</small>`:''}</span><i style="width:${Math.max(4,x.n/(x.max||1)*100)}%"></i><em>${x.n}</em></div>`;

function render(){
 const sl=$('#chips')?.scrollLeft||0;
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('#add').hidden=!(tab==='rep'||tab==='uso');
 $('#main').innerHTML=tab==='res'?resumen():tab==='inf'?report():tab==='cat'?catalog():shell();
 if(tab==='rep'||tab==='uso'){list();const c=$('#chips');if(c)c.scrollLeft=sl}
}
function resumen(){
 const sum=s=>P.filter(p=>p.section===s).reduce((a,p)=>a+p.qty,0),low=P.filter(p=>p.qty<=2).sort((a,b)=>a.qty-b.qty);
 const grp=f=>{const m={};P.forEach(p=>m[f(p)]=(m[f(p)]||0)+p.qty);return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([label,v])=>({label,v}))};
 const bl=grp(p=>p.brand),tl=grp(p=>p.type),tm=tl[0]?.v||1;
 return `<div class="head"><h2>Resumen</h2><p>Así está el stock de Sancia hoy</p></div>
 <div class="stats"><div class="glass stat" style="--c:#C9A24D"><b>${sum('rep')}</b><span>unidades en reposición</span></div><div class="glass stat" style="--c:#C9708A"><b>${sum('uso')}</b><span>unidades en uso</span></div><div class="glass stat" style="--c:#6FA886"><b>${new Set(P.map(p=>key(p))).size}</b><span>esmaltes distintos</span></div><div class="glass stat" style="--c:#C9506A"><b>${low.length}</b><span>con stock bajo o agotado</span></div></div>
 <div class="cards"><div class="glass card"><h3>Unidades por marca</h3>${bl.length?`<div class="dn">${donut(bl)}${legend(bl)}</div>`:'<p class="empty">Cargá tus primeros esmaltes.</p>'}</div>
 <div class="glass card"><h3>Movimientos · 14 días</h3>${cols()}</div></div>
 <div class="cards"><div class="glass card"><h3>Por tipo de esmalte</h3>${tl.map(x=>bar({name:x.label,n:x.v,max:tm},'t')).join('')||'<p class="empty">Sin datos todavía.</p>'}</div>
 <div class="glass card"><h3>Para reponer pronto</h3>${low.slice(0,8).map(p=>`<div class="mv"><span>${esc(p.name)} <small>${esc(p.brand)} · ${SEC[p.section]}</small></span><span class="pill ${st(p)[0]}">${p.qty} · ${st(p)[1]}</span></div>`).join('')||'<p class="empty">Todo con stock suficiente ✓</p>'}</div></div>`;
}
function shell(){
 const items=P.filter(p=>p.section===tab),bs=[...new Set(items.map(p=>p.brand))].sort();
 if(brand!=='Todas'&&!bs.includes(brand))brand='Todas';
 const n=b=>items.filter(p=>b==='Todas'||p.brand===b).reduce((a,p)=>a+p.qty,0);
 return `<div class="head hd"><div><h2>${tab==='rep'?'Stock de reposición':'Esmaltes en uso'}</h2><p>${tab==='rep'?'Lo que tenés en el depósito':'Lo que está disponible en el local'} · ${items.length} referencias</p></div><div class="xb"><button class="btn o" data-a="ximp">⬆ Importar Excel</button><button class="btn o" data-a="xexp">⬇ Exportar</button><button class="btn o" data-a="xtpl">Plantilla</button></div></div>
 <div class="car"><button class="arr" data-sc="-1" aria-label="Marcas anteriores">‹</button><div class="chips" id="chips">${['Todas',...bs].map(b=>{const all=b==='Todas',u=n(b),r=items.filter(p=>all||p.brand===b).length;return `<button class="bchip ${brand===b?'on':''}" data-brand="${esc(b)}">${all?'<span class="cm">✦</span>':bmark(b)}<span class="ct"><b>${all?'Todas las marcas':esc(b)}</b><small>${u} unidades · ${r} ref.</small></span></button>`}).join('')}</div><button class="arr" data-sc="1" aria-label="Marcas siguientes">›</button></div>
 <div class="tools"><input id="q" type="search" placeholder="Buscar esmalte o marca…" value="${esc(q)}">
 <select id="ty" aria-label="Tipo"><option value="Todos">Todos los tipos</option>${types().map(t=>`<option ${t===type?'selected':''}>${esc(t)}</option>`).join('')}</select>
 <select id="stt" aria-label="Estado">${[['Todos','Todos los estados'],['ok','Disponible'],['warn','Stock bajo'],['bad','Agotado']].map(([v,l])=>`<option value="${v}" ${stat===v?'selected':''}>${l}</option>`).join('')}</select>
 <select id="ing" aria-label="Fecha de ingreso">${[['Todos','Cualquier ingreso'],['7','Últimos 7 días'],['30','Últimos 30 días'],['90','Últimos 90 días']].map(([v,l])=>`<option value="${v}" ${ing===v?'selected':''}>${l}</option>`).join('')}</select>
 <select id="srt" aria-label="Ordenar">${[['new','Más recientes'],['old','Más antiguos'],['az','Nombre A → Z'],['za','Nombre Z → A'],['brand','Marca A → Z'],['brandza','Marca Z → A'],['hi','Mayor stock'],['lo','Menor stock']].map(([v,l])=>`<option value="${v}" ${srt===v?'selected':''}>${l}</option>`).join('')}</select>
 <button class="btn o" data-a="clr">Limpiar</button></div><p class="cnt" id="cnt"></p><div class="glass tbw" id="tbl"></div>`;
}
function list(){
 const since=ing==='Todos'?0:Date.now()-ing*864e5,S={new:(a,b)=>b.createdAt-a.createdAt,old:(a,b)=>a.createdAt-b.createdAt,az:(a,b)=>a.name.localeCompare(b.name,'es'),za:(a,b)=>b.name.localeCompare(a.name,'es'),brandza:(a,b)=>b.brand.localeCompare(a.brand,'es')||a.name.localeCompare(b.name,'es'),brand:(a,b)=>a.brand.localeCompare(b.brand,'es')||a.name.localeCompare(b.name,'es'),hi:(a,b)=>b.qty-a.qty,lo:(a,b)=>a.qty-b.qty};
 const f=P.filter(p=>p.section===tab&&(brand==='Todas'||p.brand===brand)&&(type==='Todos'||p.type===type)&&(stat==='Todos'||st(p)[0]===stat)&&p.createdAt>=since&&norm(p.name+' '+p.brand).includes(norm(q))).sort(S[srt]);
 $('#cnt').textContent=`${f.length} esmalte${f.length===1?'':'s'} · ${f.reduce((a,p)=>a+p.qty,0)} unidades`;
 $('#tbl').innerHTML=f.length?`<table class="tb"><thead><tr><th>Esmalte<th>Marca<th>Tipo<th>Stock<th>Ingreso<th>Última salida<th></tr></thead><tbody>${f.slice(0,lim).map(p=>`<tr><td><div class="nm">${bmark(p.brand)}<b>${esc(p.name)}</b></div><td data-l="Marca">${esc(p.brand)}<td data-l="Tipo"><span class="tag" style="--c:${hue(p.type)}">${esc(p.type)}</span><td data-l="Stock"><span class="pill ${st(p)[0]}">${p.qty} · ${st(p)[1]}</span><td data-l="Ingreso">${fmt(p.createdAt)}<td data-l="Última salida">${fmt(p.lastOut)}<td class="ac"><button class="ib" data-a="edit" data-id="${p.id}" title="Editar" aria-label="Editar">${ico('edit')}</button><button class="ib" data-a="plus" data-id="${p.id}" title="Agregar stock" aria-label="Agregar stock">${ico('plus')}</button><button class="ib" data-a="out" data-id="${p.id}" title="Retirar" aria-label="Retirar" ${p.qty<1?'disabled':''}>${ico('minus')}</button><button class="ib d" data-a="del" data-id="${p.id}" title="Eliminar" aria-label="Eliminar">${ico('del')}</button></tr>`).join('')}</tbody></table>${f.length>lim?`<button class="btn o more" data-more>Ver más (${f.length-lim})</button>`:''}`:'<div class="empty">No hay esmaltes acá todavía.<br>Tocá “Nuevo esmalte” o importá tu Excel.</div>';
}
function report(){
 const since=days?Date.now()-days*864e5:0,outs=M.filter(m=>m.kind==='out'&&m.section==='rep'&&!m.adj&&m.at>=since),map={};
 P.filter(p=>p.section==='rep').forEach(p=>map[p.id]={name:p.name,brand:p.brand,n:0});
 outs.forEach(m=>{const k=map[m.pid]?m.pid:key(m);(map[k]??={name:m.name,brand:m.brand,n:0}).n+=m.qty});
 const r=Object.values(map).sort((a,b)=>b.n-a.n),max=r[0]?.n||1;r.forEach(x=>x.max=max);
 const top=r.filter(x=>x.n>0).slice(0,6),low=[...r].reverse().slice(0,6),bm={};r.forEach(x=>bm[x.brand]=(bm[x.brand]||0)+x.n);
 const bl=Object.entries(bm).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(([label,v])=>({label,v}));
 return `<div class="head"><h2>Informe de uso</h2><p>Según los retiros hechos desde Reposición</p></div>
 <div class="tools">${[[30,'Últimos 30 días'],[90,'Últimos 90 días'],[0,'Todo el tiempo']].map(([d,l])=>`<button class="chip ${days===d?'on':''}" data-days="${d}">${l}</button>`).join('')}</div>
 <div class="cards"><div class="glass card"><h3>Los que más salen</h3>${top.map(x=>bar(x,'')).join('')||'<p class="empty">Aún no hay retiros en este período.</p>'}</div>
 <div class="glass card"><h3>Los que menos salen</h3>${low.map(x=>bar(x,'l')).join('')||'<p class="empty">Cargá esmaltes en Reposición.</p>'}</div></div>
 <div class="cards"><div class="glass card"><h3>Retiros por marca</h3>${bl.length?`<div class="dn">${donut(bl)}${legend(bl)}</div>`:'<p class="empty">Sin retiros en este período.</p>'}</div>
 <div class="glass card"><h3>Últimos movimientos</h3>${[...M].sort((a,b)=>b.at-a.at).slice(0,10).map(m=>`<div class="mv"><span class="${m.kind==='in'?'in':'outc'}">${m.kind==='in'?'+':'−'}${m.qty} · ${esc(m.name)}${m.adj?' <small>(ajuste)</small>':''} <small>${esc(m.brand)} · ${SEC[m.section]}</small></span><small>${fmt(m.at)}</small></div>`).join('')||'<p class="empty">Todavía no hay movimientos.</p>'}</div></div>`;
}

const SC={ok:['FFDDF5EA','FF1E7A53'],warn:['FFFCF0D4','FF8A6112'],bad:['FFFBE1E5','FFA3303F']};
const fill=c=>({type:'pattern',pattern:'solid',fgColor:{argb:c}});
function sheetBase(wb,name,title,cols){
 const ws=wb.addWorksheet(name,{views:[{state:'frozen',ySplit:4,showGridLines:false}],properties:{tabColor:{argb:'FFE3C08D'}}}),n=cols.length,last=String.fromCharCode(64+n);
 cols.forEach((c,i)=>{ws.getColumn(i+1).width=c[1]});
 ws.mergeCells(`A1:${last}1`);ws.mergeCells(`A2:${last}2`);
 for(let r=1;r<=2;r++)for(let c=1;c<=n;c++)ws.getCell(r,c).fill=fill('FF3B1F36');
 const t=ws.getCell('A1');t.value='SANCIA';t.font={name:'Georgia',size:24,bold:true,color:{argb:'FFFFFFFF'}};t.alignment={vertical:'middle',horizontal:'left',indent:1};ws.getRow(1).height=44;
 const u=ws.getCell('A2');u.value=`Nel App Stock · by Nelson Carrizo   |   ${title}   |   ${new Date().toLocaleDateString('es-AR')}`;u.font={name:'Calibri',size:10,italic:true,color:{argb:'FFE3C08D'}};u.alignment={vertical:'middle',horizontal:'left',indent:1};ws.getRow(2).height=24;
 ws.getRow(3).height=8;const h=ws.getRow(4);h.height=28;
 cols.forEach((c,i)=>{const x=h.getCell(i+1);x.value=c[0];x.font={name:'Calibri',bold:true,size:11,color:{argb:'FF3B1F36'}};x.fill=fill('FFE3C08D');x.alignment={vertical:'middle',horizontal:c[2],indent:c[2]==='left'?1:0};x.border={bottom:{style:'medium',color:{argb:'FF3B1F36'}}}});
 ws.autoFilter={from:'A4',to:`${last}4`};return ws;
}
function addRow(ws,vals,i,cols){
 const r=ws.addRow(vals);r.height=23;
 cols.forEach((c,j)=>{const x=r.getCell(j+1);x.font={name:'Calibri',size:11,color:{argb:'FF3B1F36'}};x.fill=fill(i%2?'FFF6F2EA':'FFFFFFFF');x.alignment={vertical:'middle',horizontal:c[2],indent:c[2]==='left'?1:0};x.border={bottom:{style:'thin',color:{argb:'FFE6E1D8'}}}});return r;
}
async function saveWb(wb,name){
 const buf=await wb.xlsx.writeBuffer(),a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function exportXls(only){
 if(!window.ExcelJS){toast('Necesitás conexión a internet para exportar');return}
 try{
 const wb=new ExcelJS.Workbook();wb.creator='Nel App Stock by Nelson Carrizo';
 const cs=[['Nombre',32,'left'],['Marca',18,'left'],['Tipo',20,'left'],['Cantidad',12,'center'],['Estado',16,'center'],['Fecha de ingreso',18,'center'],['Última salida',18,'center']];
 (only?[only]:['rep','uso']).forEach(sec=>{
  const ws=sheetBase(wb,SEC[sec],`Stock de ${SEC[sec].toLowerCase()}`,cs);
  P.filter(p=>p.section===sec).sort((a,b)=>a.brand.localeCompare(b.brand,'es')||a.name.localeCompare(b.name,'es')).forEach((p,i)=>{
   const k=st(p)[0],r=addRow(ws,[p.name,p.brand,p.type,p.qty,st(p)[1],fmt(p.createdAt),fmt(p.lastOut)],i,cs);
   [4,5].forEach(j=>{const x=r.getCell(j);x.fill=fill(SC[k][0]);x.font={name:'Calibri',size:11,bold:true,color:{argb:SC[k][1]}}})});
 });
 if(!only){const mc=[['Fecha',16,'center'],['Movimiento',15,'center'],['Esmalte',32,'left'],['Marca',18,'left'],['Tipo',20,'left'],['Cantidad',12,'center'],['Sección',16,'left']],wm=sheetBase(wb,'Movimientos','Historial de movimientos',mc);
 [...M].sort((a,b)=>b.at-a.at).forEach((m,i)=>{const r=addRow(wm,[fmt(m.at),m.kind==='in'?'Ingreso':'Retiro',m.name,m.brand,m.type,m.qty,SEC[m.section]],i,mc);r.getCell(2).font={name:'Calibri',size:11,bold:true,color:{argb:m.kind==='in'?'FF1E7A53':'FFA3303F'}}});
 }
 await saveWb(wb,`Sancia-${only==='uso'?'en-uso':only==='rep'?'reposicion':'stock'}-${new Date().toISOString().slice(0,10)}.xlsx`);toast('Excel descargado');
 }catch(e){console.error(e);toast('No se pudo crear el Excel')}
}
async function template(sec){
 if(!window.ExcelJS){toast('Necesitás conexión a internet para descargar la plantilla');return}
 try{
 const wb=new ExcelJS.Workbook(),cs=[['Nombre',34,'left'],['Marca',20,'left'],['Tipo',22,'left'],['Cantidad',14,'center']],ws=sheetBase(wb,sec?SEC[sec]:'Esmaltes',`Plantilla${sec?' · '+SEC[sec]:''} · completá desde la fila 5`,cs);
 for(let i=0;i<80;i++){const r=addRow(ws,['','','',''],i,cs),n=r.number;
  ws.getCell(n,3).dataValidation={type:'list',allowBlank:true,formulae:['"'+types().join(',')+'"']};
  ws.getCell(n,4).dataValidation={type:'whole',operator:'greaterThanOrEqual',allowBlank:true,formulae:[0]}}
 await saveWb(wb,sec==='uso'?'Plantilla-en-uso-Sancia.xlsx':sec==='rep'?'Plantilla-reposicion-Sancia.xlsx':'Plantilla-esmaltes-Sancia.xlsx');
 }catch(e){console.error(e);toast('No se pudo crear la plantilla')}
}
async function readXls(f){
 const wb=XLSX.read(await f.arrayBuffer()),out=[],N=['nombre','esmalte','name','producto'];
 wb.SheetNames.forEach(sn=>{const ns=norm(sn);if(ns.includes('movim'))return;const sec=ns.includes('uso')?'uso':ns.includes('repos')?'rep':null;
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''}),hi=rows.findIndex(r=>r.some(c=>N.includes(norm(c))));if(hi<0)return;
  const H=rows[hi].map(norm),col=n=>H.findIndex(h=>n.includes(h));
  const iN=col(N),iB=col(['marca','brand']),iT=col(['tipo','type']),iQ=col(['cantidad','cant','stock','qty','unidades']);
  rows.slice(hi+1).forEach(a=>{const name=String(a[iN]??'').trim();if(!name)return;
   out.push({name,brand:canonBrand(String(iB>=0?a[iB]:'').trim()||'Sin marca'),type:canonType(iT>=0?a[iT]:''),qty:Math.max(0,parseInt(iQ>=0?a[iQ]:0)||0),sec})})});
 return out;
}
async function importRows(rows,defSec,mode){
 const seen=new Set(),now=Date.now(),ops=[],res={add:0,upd:0,skip:0};
 rows.forEach(r=>{const sec=r.sec||defSec,k=sec+'|'+key(r);if(seen.has(k)){res.skip++;return}seen.add(k);
  const ex=P.find(p=>p.section===sec&&key(p)===key(r));if(ex&&mode==='skip'){res.skip++;return}ops.push({r,sec,ex})});
 try{for(let i=0;i<ops.length;i+=200){const b=writeBatch(db);
  ops.slice(i,i+200).forEach(({r,sec,ex})=>{let id,delta,adj={};
   if(ex){id=ex.id;delta=mode==='set'?r.qty-ex.qty:r.qty;adj=mode==='set'?{adj:true}:{};res.upd++;
    b.update(doc(db,'polishes',id),mode==='set'?{qty:r.qty,...(delta>0?{lastIn:now}:delta<0?{lastOut:now}:{})}:{qty:increment(r.qty),lastIn:now})}
   else{const d=doc(collection(db,'polishes'));id=d.id;delta=r.qty;res.add++;b.set(d,{name:r.name,brand:r.brand,type:r.type,section:sec,qty:r.qty,createdAt:now,lastIn:now,lastOut:null})}
   if(delta)b.set(doc(collection(db,'movements')),{pid:id,name:r.name,brand:r.brand,type:r.type,section:sec,kind:delta>0?'in':'out',qty:Math.abs(delta),at:now,...adj})});
  await b.commit()}
 toast(`Nuevos: ${res.add} · Actualizados: ${res.upd} · Omitidos: ${res.skip}`)}catch(e){fail(e)}
}
let impSec=null;
function openImport(rows){
 const fx=impSec;if(fx)rows=rows.filter(r=>!r.sec||r.sec===fx);
 show(`<h2>Importar desde Excel</h2><p>Se leyeron <b>${rows.length}</b> filas${fx?` para <b>${SEC[fx]}</b>`:''}.</p>
 ${fx?'':`<label>Cargar en (si la hoja no dice “Reposición” o “En uso”)<select id="s"><option value="rep" ${tab!=='uso'?'selected':''}>Reposición (depósito)</option><option value="uso" ${tab==='uso'?'selected':''}>En uso (local)</option></select></label>`}
 <label>Si el esmalte ya está cargado<select id="m"><option value="skip">No tocarlo (evita duplicados)</option><option value="set">Reemplazar su cantidad por la del Excel</option><option value="add">Sumar la cantidad del Excel</option></select></label>
 <div class="row"><button class="btn o" id="no">Cancelar</button><button class="btn" id="ok">Importar</button></div>`,()=>{importRows(rows,fx||$('#s').value,$('#m').value);dlg.close()});
}
$('#xl').onclick=openExcel;
$('#xf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const r=await readXls(f);r.length?openImport(r):toast('No encontré datos. Revisá los títulos: Nombre, Marca, Tipo, Cantidad')}catch(x){toast('No se pudo leer el archivo')}};

/* ---------- Catálogo (tipos y marcas) ---------- */
const FLD={types:'type',brands:'brand'},NAME={types:'tipo',brands:'marca'};
function catalog(){
 const box=(k,title,sub,ls)=>`<div class="glass card"><h3>${title}</h3><p class="sub">${sub}</p>
 <div class="addrow"><input id="ni-${k}" placeholder="Nuevo ${NAME[k]}…" maxlength="30"><button class="btn" data-a="cadd" data-k="${k}">Agregar</button></div>
 ${ls.map(v=>{const n=P.filter(p=>p[FLD[k]]===v).length,lock=k==='types'&&v==='Otros';return `<div class="mv"><span class="cn">${k==='brands'?bmark(v):`<span class="mono" style="--c:${hue(v)}">${esc(v.slice(0,2).toUpperCase())}</span>`}<span><b>${esc(v)}</b><small>${n} esmalte${n===1?'':'s'}</small></span></span><span>${lock?'<small>Por defecto</small>':`${k==='brands'?`<button class="ib" data-a="clogo" data-v="${esc(v)}" title="Logo" aria-label="Logo de ${esc(v)}">${ico('img')}</button>`:''}<button class="ib" data-a="cren" data-k="${k}" data-v="${esc(v)}" title="Editar" aria-label="Editar ${esc(v)}">${ico('edit')}</button><button class="ib d" data-a="cdel" data-k="${k}" data-v="${esc(v)}" title="Eliminar" aria-label="Eliminar ${esc(v)}">${ico('del')}</button>`}</span></div>`}).join('')||'<p class="empty">Todavía no hay nada.</p>'}</div>`;
 return `<div class="head"><h2>Catálogo</h2><p>Administrá tus tipos y marcas: editá nombres, agregá o eliminá.</p></div><div class="cards">${box('types','Tipos de esmalte','Aparecen al cargar y al filtrar.',types())}${box('brands','Marcas','Ordenadas de la A a la Z.',brands())}</div>`;
}
function moveField(f,old,nw){
 const own=P.filter(p=>p[f]===old),clash=own.find(p=>P.some(x=>x[f]!==old&&x.section===p.section&&key({...p,[f]:nw})===key(x)));
 if(clash){toast(`No se puede: ya existe "${clash.name}" con ese ${f==='type'?'tipo':'nombre de marca'}`);return false}
 for(let i=0;i<own.length;i+=400){const b=writeBatch(db);own.slice(i,i+400).forEach(p=>b.update(doc(db,'polishes',p.id),{[f]:nw}));b.commit().catch(fail)}
 return true;
}
function catAct(a,k,v){
 const f=FLD[k],ls=k==='types'?types():brands();
 if(a==='cadd'){const el=$('#ni-'+k),n=el.value.trim().replace(/^./,c=>c.toUpperCase());if(!n)return;
  if(ls.some(x=>norm(x)===norm(n))){toast(`Ya existe ese ${NAME[k]}`);return}
  saveCat(k,[...ls,n]).catch(fail);toast('Agregado');return}
 if(a==='cren')return show(`<h2>Editar ${NAME[k]}</h2><p>El cambio se aplica a todos los esmaltes que lo usan.</p><label>Nombre<input id="rn" value="${esc(v)}" maxlength="30"></label><p class="er" id="er"></p><div class="row"><button class="btn o" id="no">Cancelar</button><button class="btn" id="ok">Guardar</button></div>`,()=>{
  const n=$('#rn').value.trim();if(!n){$('#er').textContent='Escribí un nombre.';return}
  if(norm(n)!==norm(v)&&ls.some(x=>norm(x)===norm(n))){$('#er').textContent=`Ya existe un ${NAME[k]} con ese nombre.`;return}
  if(!moveField(f,v,n))return;saveCat(k,ls.map(x=>x===v?n:x)).catch(fail);toast('Guardado');dlg.close()});
 if(a==='cdel'){const n=P.filter(p=>p[f]===v).length;
  if(k==='brands'&&n){toast(`"${v}" tiene ${n} esmaltes. Cambiales la marca o eliminalos antes.`);return}
  if(!confirm(k==='types'&&n?`${n} esmaltes tienen el tipo "${v}" y pasarán a "Otros". ¿Eliminar el tipo?`:`¿Eliminar ${NAME[k]} "${v}"?`))return;
  if(k==='types'&&n&&!moveField(f,v,'Otros'))return;
  saveCat(k,ls.filter(x=>x!==v)).catch(fail);toast('Eliminado')}
}

/* ---------- Logos de marcas ---------- */
let logoFor=null;
const setLogo=(b,url)=>{const bt=writeBatch(db);bt.set(doc(db,'settings','catalog'),{logos:{[norm(b)]:url}},{merge:true});bt.commit().catch(fail);toast(url?'Logo guardado':'Logo quitado')};
function openLogo(b){
 show(`<h2>Logo de ${esc(b)}</h2>${logoOf(b)?`<div class="lp"><img src="${logoOf(b)}" alt=""></div>`:'<p>Esta marca todavía no tiene logo.</p>'}<p>Subí una imagen (PNG o JPG) con el logo oscuro sobre fondo blanco o transparente.</p>
 <div class="col"><button class="btn" id="l1">Subir imagen</button>${logoOf(b)?'<button class="btn o" id="l2">Quitar logo</button>':''}<button class="btn o" id="no">Cerrar</button></div>`);
 $('#l1').onclick=()=>{logoFor=b;dlg.close();$('#lf').click()};const q=$('#l2');if(q)q.onclick=()=>{setLogo(b,'');dlg.close()};
}
$('#lf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!logoFor)return;
 try{const bmp=await createImageBitmap(f),k=Math.min(1,360/bmp.width,150/bmp.height),w=Math.max(1,Math.round(bmp.width*k)),h=Math.max(1,Math.round(bmp.height*k)),cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const x=cv.getContext('2d');x.drawImage(bmp,0,0,w,h);const d=x.getImageData(0,0,w,h),a=d.data;
  for(let i=0;i<a.length;i+=4){const m=Math.min(a[i],a[i+1],a[i+2]);a[i+3]=Math.min(a[i+3],Math.max(0,Math.min(255,(250-m)*255/160)))}
  x.putImageData(d,0,0);setLogo(logoFor,cv.toDataURL('image/png'))}catch(x){toast('No se pudo leer la imagen')}};

/* ---------- Eventos ---------- */
$('#add').onclick=openAdd;
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;brand='Todas';$('#chips')?.scrollTo(0,0);type='Todos';lim=20;render()}};
$('#main').onclick=e=>{
 const t=e.target.closest('[data-brand],[data-days],[data-a],[data-more],[data-sc]');if(!t)return;
 if(t.dataset.a==='clr'){q='';type='Todos';stat='Todos';ing='Todos';srt='new';brand='Todas';lim=20;render();return}
 if(t.dataset.a==='clogo'){openLogo(t.dataset.v);return}
 if(t.dataset.a==='ximp'){impSec=tab;$('#xf').click();return}
 if(t.dataset.a==='xexp'){exportXls(tab);return}
 if(t.dataset.a==='xtpl'){template(tab);return}
 if(['cadd','cren','cdel'].includes(t.dataset.a)){catAct(t.dataset.a,t.dataset.k,t.dataset.v);return}
 if(t.dataset.sc){$('#chips').scrollBy({left:t.dataset.sc*240,behavior:'smooth'});return}
 if(t.dataset.brand){brand=t.dataset.brand;lim=20;render()}
 else if(t.dataset.days){days=+t.dataset.days;render()}
 else if('more'in t.dataset){lim+=20;list()}
 else{const p=P.find(x=>x.id===t.dataset.id);if(!p)return;({edit:()=>openEdit(p),out:()=>openOut(p),plus:()=>openPlus(p),del:()=>remove(p)})[t.dataset.a]()}
};
$('#main').oninput=e=>{if(e.target.id==='q'){q=e.target.value;lim=20;list()}};
$('#main').onchange=e=>{const m={ty:v=>type=v,stt:v=>stat=v,ing:v=>ing=v,srt:v=>srt=v}[e.target.id];if(m){m(e.target.value);lim=20;list()}};
</script></body></html>
